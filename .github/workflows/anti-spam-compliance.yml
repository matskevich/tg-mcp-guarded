name: Anti-spam Compliance & Security

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  anti-spam-compliance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tganalytics:.
      TG_API_ID: '1'
      TG_API_HASH: testhash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install bandit flake8
      - name: anti-spam compliance and api audit
        run: make telegram-api-audit
      - name: security scan
        run: bandit -r tganalytics/ -ll -f json -o bandit-report.json
      - name: syntax and undefined-name checks
        run: flake8 tganalytics/ tests/ scripts/ --select=E9,F63,F7,F82 --show-source --statistics
      - name: tests with compliance
        run: python -m pytest tests/ -q
      - name: upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
          retention-days: 30
